  <style>

    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">

    </div>

<body>
  <div id="__bundler_placeholder">Loading Viva la Vida FAQ...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ont-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; font-size: 15px; color: #FFC93C\">🌼 Reilly Elementary PTA presents 🌼<\u002Fp>\n<h1 style=\"margin: 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: clamp(52px, 15vw, 80px); line-height: 0.95; color: #FF8C1A\">¡Viva la Vida!<\u002Fh1>\n<p style=\"margin: 10px 0 0; font-family: 'Lilita One', sans-serif; font-size: clamp(26px, 4vw, 40px); color: #FF5CAD\">Parade &amp; Festival FAQ 🌼<\u002Fp>\n<p style=\"margin: 20px auto 0; max-width: 700px; font-size: 17px; line-height: 1.6\">We are <strong style=\"color: #FFC93C\">thrilled<\u002Fstrong> to announce that Reilly Elementary is officially part of Austin's Viva la Vida Parade and Festival! Everyone is welcome to walk in the parade with us as we join our Austin community in honoring Día de los Muertos, a beautiful tradition of remembering and celebrating the lives of loved ones who have passed. 🕯️🌼 Come out, celebrate, and represent Reilly! 💛<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 28px\">\n<span style=\"background: #FF8C1A; color: #2A1640; font-weight: 800; padding: 10px 18px; border-radius: 999px; font-size: 16px\">📅 Sat, Oct 24, 2026<\u002Fspan>\n<span style=\"background: #FF5CAD; color: #2A1640; font-weight: 800; padding: 10px 18px; border-radius: 999px; font-size: 16px\">🥁 Parade 12–1 PM<\u002Fspan>\n<span style=\"background: #2EC4B6; color: #2A1640; font-weight: 800; padding: 10px 18px; border-radius: 999px; font-size: 16px\">🎪 Festival 12–6 PM<\u002Fspan>\n<span style=\"background: #FFC93C; color: #2A1640; font-weight: 800; padding: 10px 18px; border-radius: 999px; font-size: 16px\">🎟️ 100% Free<\u002Fspan>\n<\u002Fdiv>\n<div style=\"margin-top: 20px; background: #FFF4E0; color: #2A1640; border-radius: 20px; padding: 16px 18px; text-align: left; display: flex; gap: 14px; align-items: center\">\n<span style=\"font-size: 36px; line-height: 1\">📍<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 2px\">\n<span style=\"font-weight: 800; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #9E0052\">Walking with Reilly?<\u002Fspan>\n<span style=\"font-family: 'Lilita One', sans-serif; font-size: 22px; line-height: 1.2\">Meet at 6th St &amp; Red River at 10:00 AM<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fheader>\n\n<main style=\"max-width: 600px; margin: 0 auto; padding: 0 12px; display: flex; flex-direction: column; gap: 24px\">\n\n<section style=\"background: #FFF4E0; border-radius: 24px; overflow: hidden\">\n<h2 style=\"margin: 0; padding: 16px 20px; background: #FFC93C; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 26px; color: #2A1640\">⏰ Day-of Schedule<\u002Fh2>\n<div style=\"padding: 4px 20px 12px; display: flex; flex-direction: column\">\n<div style=\"display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-bottom: 2px dashed #F2D58A\">\n<span style=\"flex: 0 0 84px; background: #FF8C1A; color: #2A1640; font-weight: 800; font-size: 15px; text-align: center; border-radius: 999px; padding: 6px 0\">9:00 AM<\u002Fspan>\n<div><h3 style=\"margin: 0 0 4px; font-size: 18px; line-height: 1.3; font-weight: 800; color: #2A1640\">🚗 Arrive downtown<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.55\">Park or get dropped off, then head to the meeting spot. There's no assigned parking, and 6th Street will be blocked off, so plan drop-offs on 5th or 7th Street.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-bottom: 2px dashed #F2D58A\">\n<span style=\"flex: 0 0 84px; background: #FF5CAD; color: #2A1640; font-weight: 800; font-size: 15px; text-align: center; border-radius: 999px; padding: 6px 0\">10:00 AM<\u002Fspan>\n<div><h3 style=\"margin: 0 0 4px; font-size: 18px; line-height: 1.3; font-weight: 800; color: #2A1640\">📍 Reilly meet-up<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.55\">Find us at the corner of <strong>6th Street &amp; Red River Street<\u002Fstrong>. We'll hand out decorations for bikes, wagons and strollers. All minors must be with an adult.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-bottom: 2px dashed #F2D58A\">\n<span style=\"flex: 0 0 84px; background: #2EC4B6; color: #2A1640; font-weight: 800; font-size: 15px; text-align: center; border-radius: 999px; padding: 6px 0\">11:00 AM<\u002Fspan>\n<div><h3 style=\"margin: 0 0 4px; font-size: 18px; line-height: 1.3; font-weight: 800; color: #2A1640\">📸 Group photo &amp; food<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.55\">Smile for the Reilly group photo! Food for Reilly families comes shortly after.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-bottom: 2px dashed #F2D58A\">\n<span style=\"flex: 0 0 84px; background: #FFC93C; color: #2A1640; font-weight: 800; font-size: 15px; text-align: center; border-radius: 999px; padding: 6px 0\">12:00 PM<\u002Fspan>\n<div><h3 style=\"margin: 0 0 4px; font-size: 18px; line-height: 1.3; font-weight: 800; color: #2A1640\">🥁 Parade begins!<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.55\">We walk about ¾ mile west down Historic 6th Street. The procession lasts about an hour.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start; padding: 14px 0;\">\n<span style=\"flex: 0 0 84px; background: #C9A7F5; color: #2A1640; font-weight: 800; font-size: 15px; text-align: center; border-radius: 999px; padding: 6px 0\">1:00 PM<\u002Fspan>\n<div><h3 style=\"margin: 0 0 4px; font-size: 18px; line-height: 1.3; font-weight: 800; color: #2A1640\">🕯️ Arrive &amp; offer our ofrenda<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.55\">We reach the festival at the NW corner of Congress &amp; 4th Street (near Republic Square Park). Reilly families place our handmade crafts on the community altar as an ofrenda (offering). Then enjoy the festival until 6 PM!<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #FFF4E0; border-radius: 24px; overflow: hidden\">\n<h2 style=\"margin: 0; padding: 16px 20px; background: #FF8C1A; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 26px; color: #2A1640\">🌼 General Event Details<\u002Fh2>\n<div style=\"padding: 4px 20px 20px; display: flex; flex-direction: column\">\n<div style=\"padding: 18px 0; border-bottom: 2px dashed #F2C9A0\">\n<h3 style=\"margin: 0 0 6px; font-size: 18px; line-height: 1.3; font-weight: 800; color: #9C3D00\">💀 What is the Viva la Vida Festival?<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6\">Hosted by the Mexic-Arte Museum, it is Austin's largest and longest-running Día de los Muertos (Day of the Dead) event. This year marks the <strong>43rd annual<\u002Fstrong> Viva la Vida Festival &amp; Parade!<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 18px 0; border-bottom: 2px dashed #F2C9A0\">\n<h3 style=\"margin: 0 0 6px; font-size: 18px; line-height: 1.3; font-weight: 800; color: #9C3D00\">📅 When is the event?<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6\"><strong>Saturday, October 24, 2026.<\u002Fstrong> The grand procession (parade) kicks off at 12:00 PM and runs until 1:00 PM. The main street festival runs from 12:00 PM to 6:00 PM. If you want to walk with Reilly, meet us at <strong>6th Street &amp; Red River Street at 10:00 AM<\u002Fstrong>. See the full Day-of Schedule above! 🧡<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 18px 0; border-bottom: 2px dashed #F2C9A0\">\n<h3 style=\"margin: 0 0 6px; font-size: 18px; line-height: 1.3; font-weight: 800; color: #9C3D00\">📍 Where is the festival located?<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6\">Downtown Austin! The parade lines up near 6th &amp; Red River and travels about ¾ mile west down Historic 6th Street to the main festival grounds at 4th Street and Congress Avenue (near Republic Square Park).<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 18px 0; border-bottom: 2px dashed #F2C9A0\">\n<h3 style=\"margin: 0 0 6px; font-size: 18px; line-height: 1.3; font-weight: 800; color: #9C3D00\">💸 How much does it cost?<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6\">Nada! Admission to the festival and participation in the parade is completely free and open to all ages. 🎉<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 18px 0; border-bottom: 2px dashed #F2C9A0\">\n<h3 style=\"margin: 0 0 6px; font-size: 18px; line-height: 1.3; font-weight: 800; color: #9C3D00\">🚗 Where should we park?<\u002Fh3>\n<p style=\"margin: 0 0 10px; font-size: 17px; line-height: 1.6\">There is <strong>no assigned parking<\u002Fstrong> for parade participants, and downtown parking fills quickly. Give yourself the 9:00 hour to park or get dropped off. Here are some options:<\u002Fp>\n<ul style=\"font-size: 17px; line-height: 1.6\">\n<li>🅿️ <strong>City Garages:<\u002Fstrong> Austin Convention Center, City Hall Garage, One Texas Center, Palmer Events Center, and RiverSouth.<\u002Fli>\n<li>🏷️ <strong>Discounted Parking:<\u002Fstrong> Mexic-Arte Museum offers special discounted parking ($10 for 4 hours) at the Frost Bank Tower Garage.<\u002Fli>\n<li>🚕 <strong>Drop-off Tip:<\u002Fstrong> 6th Street will be blocked off! Parade organizers recommend dropping people off on <strong>5th or 7th Street<\u002Fstrong> and walking to the staging area.<\u002Fli>\n<li>🚌 <strong>Public Transit:<\u002Fstrong> Capital Metro buses and rideshares are highly recommended. CapMetro buses drop off near 4th Street and Congress Avenue, and transit centers like South Congress or Tech Ridge Park &amp; Ride offer easy bus access.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"padding: 18px 0\">\n<h3 style=\"margin: 0 0 6px; font-size: 18px; line-height: 1.3; font-weight: 800; color: #9C3D00\">🌧️ What happens if it rains?<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6\">We'll communicate if it's cancelled, but you can also keep up <a href=\"https://mexic-artemuseum.org/event/43rd-annual-viva-la-vida-festival-parade/\">on the Mexic-Arte Museum event page<\u002Fa>.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #FFF4E0; border-radius: 24px; overflow: hidden\">\n<h2 style=\"margin: 0; padding: 16px 20px; background: #FF5CAD; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 26px; color: #2A1640\">🥁 Walking with Reilly Elementary<\u002Fh2>\n<div style=\"padding: 4px 20px 20px; display: flex; flex-direction: column\">\n<div style=\"padding: 18px 0; border-bottom: 2px dashed #F5B8D5\">\n<h3 style=\"margin: 0 0 6px; font-size: 18px; line-height: 1.3; font-weight: 800; color: #9E0052\">🙌 Can everybody participate?<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6\">Yes! Every Reilly family is welcome and encouraged to walk with our float in the parade.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 18px 0; border-bottom: 2px dashed #F5B8D5\">\n<h3 style=\"margin: 0 0 6px; font-size: 18px; line-height: 1.3; font-weight: 800; color: #9E0052\">👋 Can we just show up?<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6\">Absolutely! You can just show up on the day of the event to walk with us.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 18px 0; border-bottom: 2px dashed #F5B8D5\">\n<h3 style=\"margin: 0 0 6px; font-size: 18px; line-height: 1.3; font-weight: 800; color: #9E0052\">📌 What is the exact meeting location and time for Reilly participants?<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6\">Meet us at the corner of <strong>6th Street &amp; Red River Street at 10:00 AM<\u002Fstrong>. Look for the Reilly crew! 🌼 We'll take a group photo at 11:00 AM, so don't be late!<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 18px 0; border-bottom: 2px dashed #F5B8D5\">\n<h3 style=\"margin: 0 0 6px; font-size: 18px; line-height: 1.3; font-weight: 800; color: #9E0052\"><img src=\"1854fd96-0ddd-4e26-b00d-85f64cc10b89\" alt=\"\" style=\"height: 1.3em; width: auto; vertical-align: -0.3em\"> Can we bring wagons or strollers?<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6\">Absolutely! At the 10:00 AM meet-up we'll hand out decorations for bikes, wagons, strollers and more, so come a little early to deck them out. 🌸<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 18px 0; border-bottom: 2px dashed #F5B8D5\">\n<h3 style=\"margin: 0 0 6px; font-size: 18px; line-height: 1.3; font-weight: 800; color: #9E0052\">👨‍👩‍👧 Is childcare provided? (Can I drop my kid off?)<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6\"><strong>No.<\u002Fstrong> All minors must be with an adult. Parents and guardians are entirely responsible for their children and must stay with their kids the whole time. This is a family-participation event, not a drop-off childcare service.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 18px 0; border-bottom: 2px dashed #F5B8D5\">\n<h3 style=\"margin: 0 0 6px; font-size: 18px; line-height: 1.3; font-weight: 800; color: #9E0052\">👕 What should we wear?<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6\">We encourage everybody to wear a <strong>Reilly Elementary shirt!<\u002Fstrong> You can also come in Día de los Muertos face paint 💀🎨 to match the spirit of the event. Our theme is <strong>Keep Austin Weird<\u002Fstrong>, so you have full creative license! 🤩<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 18px 0; border-bottom: 2px dashed #F5B8D5\">\n<h3 style=\"margin: 0 0 8px; font-size: 18px; line-height: 1.3; font-weight: 800; color: #9E0052\">🎒 What should we bring?<\u002Fh3>\n<ul style=\"font-size: 17px; line-height: 1.5; padding-left: 0; margin: 0\">\n<li style=\"display: flex; gap: 10px; align-items: flex-start; list-style: none; margin: 6px 0\"><span style=\"flex: 0 0 26px; text-align: center\">😁<\u002Fspan><span><strong>Smiles!<\u002Fstrong> Bring your best Reilly spirit.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 10px; align-items: flex-start; list-style: none; margin: 6px 0\"><span style=\"flex: 0 0 26px; text-align: center\"><img src=\"1854fd96-0ddd-4e26-b00d-85f64cc10b89\" alt=\"\" style=\"height: 1.3em; width: auto; vertical-align: -0.3em\"><\u002Fspan><span><strong>A stroller or wagon<\u002Fstrong>, if you wish.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 10px; align-items: flex-start; list-style: none; margin: 6px 0\"><span style=\"flex: 0 0 26px; text-align: center\">🌮<\u002Fspan><span><strong>Food, snacks &amp; water<\u002Fstrong> you may need.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 10px; align-items: flex-start; list-style: none; margin: 6px 0\"><span style=\"flex: 0 0 26px; text-align: center\">🎧<\u002Fspan><span><strong>Ear protection<\u002Fstrong>, if you wish. The parade gets quite loud!<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 10px; align-items: flex-start; list-style: none; margin: 6px 0\"><span style=\"flex: 0 0 26px; text-align: center\">🎭<\u002Fspan><span><strong>Your costume and/or costume makeup.<\u002Fstrong><\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 10px; align-items: flex-start; list-style: none; margin: 6px 0\"><span style=\"flex: 0 0 26px; text-align: center\">👟<\u002Fspan><span><strong>Comfy shoes<\u002Fstrong> for the ¾-mile route.<\u002Fspan><\u002Fli>\n<li style=\"display: flex; gap: 10px; align-items: flex-start; list-style: none; margin: 6px 0\"><span style=\"flex: 0 0 26px; text-align: center\">☀️<\u002Fspan><span><strong>Weather protection:<\u002Fstrong> sunscreen and hats for sun, or rain gear if showers are in the forecast. ☔<\u002Fspan><\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"padding: 18px 0\">\n<h3 style=\"margin: 0 0 6px; font-size: 18px; line-height: 1.3; font-weight: 800; color: #9E0052\">🥤 Should families bring their own water and snacks?<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6\">We'll share food with Reilly families right after our 11:00 AM group photo, but please bring water and any food you may want. The festival has food vendors as well. 🌮<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #FFF4E0; border-radius: 24px; overflow: hidden\">\n<h2 style=\"margin: 0; padding: 16px 20px; background: #2EC4B6; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 26px; color: #2A1640\">🎨 Preparing for the Event<\u002Fh2>\n<div style=\"padding: 4px 20px 20px; display: flex; flex-direction: column\">\n<div style=\"padding: 18px 0; border-bottom: 2px dashed #A8E3DD\">\n<h3 style=\"margin: 0 0 6px; font-size: 18px; line-height: 1.3; font-weight: 800; color: #0B6158\">✂️ Will there be pre-event activities for the kids?<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6\">Yes! On <strong>Monday, October 12, from 10:00 AM to 2:00 PM<\u002Fstrong> (during the teacher conference day), we will have a craft table set up. Kids can come make fun crafts and accessories to wear for the festival, plus special pieces for the community ofrenda that we'll place on the altar at the end of the parade! 🕯️<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 18px 0; border-bottom: 2px dashed #A8E3DD\">\n<h3 style=\"margin: 0 0 6px; font-size: 18px; line-height: 1.3; font-weight: 800; color: #0B6158\">🤝 How can I help before the event?<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6\">We need you! Support the PTA by donating art supplies to help us prepare our float and festival crafts.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 18px 0; border-bottom: 2px dashed #A8E3DD\">\n<h3 style=\"margin: 0 0 6px; font-size: 18px; line-height: 1.3; font-weight: 800; color: #0B6158\">🖍️ What art supplies are you looking for?<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6\">Tissue paper, streamers, pipe cleaners, paint, etc.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 18px 0; border-bottom: 2px dashed #A8E3DD\">\n<h3 style=\"margin: 0 0 6px; font-size: 18px; line-height: 1.3; font-weight: 800; color: #0B6158\">📦 Where can we drop off donated supplies?<\u002Fh3>\n<p style=\"margin: 0; font-size: 17px; line-height: 1.6\">Deliver them to <strong>Mr. James<\u002Fstrong>, the Reilly Art teacher.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding: 18px 0\">\n<h3 style=\"margin: 0 0 10px; font-size: 18px; line-height: 1.3; font-weight: 800; color: #0B6158\">🏠 Can we make crafts at home?<\u002Fh3>\n<p style=\"margin: 0 0 14px; font-size: 17px; line-height: 1.6\">For sure! Here are some ideas:<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px\">\n<a href=\"https://www.youtube.com/watch?v=C-05DzigmCg\" style=\"text-decoration: none; background: #FF8C1A; color: #2A1640; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 6px; min-height: 44px\"><span style=\"font-size: 36px\">🌼<\u002Fspan><span style=\"font-family: 'Lilita One', sans-serif; font-size: 22px\">Tissue Paper Marigolds<\u002Fspan><span style=\"font-size: 14px; font-weight: 700\">Watch the video →<\u002Fspan><\u002Fa>\n<a href=\"https://www.youtube.com/watch?v=K9lYizPO7gM\" style=\"text-decoration: none; background: #FF5CAD; color: #2A1640; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 6px; min-height: 44px\"><span style=\"font-size: 36px\">🎏<\u002Fspan><span style=\"font-family: 'Lilita One', sans-serif; font-size: 22px\">Papel Picado<\u002Fspan><span style=\"font-size: 14px; font-weight: 700\">Watch the video →<\u002Fspan><\u002Fa>\n<a href=\"https://www.youtube.com/watch?v=VlV73NpUDeE\" style=\"text-decoration: none; background: #2EC4B6; color: #2A1640; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 6px; min-height: 44px\"><span style=\"font-size: 36px\">💀<\u002Fspan><span style=\"font-family: 'Lilita One', sans-serif; font-size: 22px\">Paper Plate Masks<\u002Fspan><span style=\"font-size: 14px; font-weight: 700\">Watch the video →<\u002Fspan><\u002Fa>\n<a href=\"https://www.youtube.com/watch?v=_q7g1B2c8c8\" style=\"text-decoration: none; background: #C9A7F5; color: #2A1640; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 6px; min-height: 44px\"><span style=\"font-size: 36px\">🕯️<\u002Fspan><span style=\"font-family: 'Lilita One', sans-serif; font-size: 22px\">Build an Ofrenda<\u002Fspan><span style=\"font-size: 14px; font-weight: 700\">Watch the video →<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display: flex; flex-direction: column; gap: 12px\">\n<h2 style=\"margin: 0; text-align: center; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 30px; color: #FFC93C\">✨ ¿Sabías Que? ✨<\u002Fh2>\n<p style=\"margin: 0 0 4px; text-align: center; color: #FFF4E0; font-size: 16px\">Did you know? Cool cultural nuggets to share with your kids on the way downtown!<\u002Fp>\n<div style=\"background: #FF8C1A; color: #2A1640; border-radius: 20px; padding: 18px 20px; display: flex; gap: 14px; align-items: flex-start\"><span style=\"font-size: 34px; line-height: 1\">🕯️<\u002Fspan><div><h3 style=\"margin: 0 0 4px; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 21px\">This year's theme: La Ofrenda<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.55\">An ofrenda is an altar families build to welcome loved ones' spirits home, with photos, candles and their favorite foods. In this year's parade, artist-made altar pieces are carried down 6th Street and assembled into one giant altar at the festival!<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div style=\"background: #FFC93C; color: #2A1640; border-radius: 20px; padding: 18px 20px; display: flex; gap: 14px; align-items: flex-start\"><span style=\"font-size: 34px; line-height: 1\">🌼<\u002Fspan><div><h3 style=\"margin: 0 0 4px; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 21px\">Flowers that light the way<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.55\">Orange marigolds, called cempasúchil, are the signature flower of the holiday. Their bright color and strong scent are said to guide spirits back to their families.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div style=\"background: #FF5CAD; color: #2A1640; border-radius: 20px; padding: 18px 20px; display: flex; gap: 14px; align-items: flex-start\"><span style=\"font-size: 34px; line-height: 1\">💀<\u002Fspan><div><h3 style=\"margin: 0 0 4px; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 21px\">Happy skulls, not spooky ones<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.55\">Smiling calaveras (decorated skulls) celebrate life instead of fearing death. The elegant skeleton lady, La Catrina, was first drawn over 100 years ago by Mexican artist José Guadalupe Posada.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div style=\"background: #2EC4B6; color: #2A1640; border-radius: 20px; padding: 18px 20px; display: flex; gap: 14px; align-items: flex-start\"><span style=\"font-size: 34px; line-height: 1\">🎏<\u002Fspan><div><h3 style=\"margin: 0 0 4px; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 21px\">Papel picado<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.55\">These colorful cut-paper banners flutter in the breeze, and their delicate paper is a reminder of how precious and fragile life is.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div style=\"background: #C9A7F5; color: #2A1640; border-radius: 20px; padding: 18px 20px; display: flex; gap: 14px; align-items: flex-start\"><span style=\"font-size: 34px; line-height: 1\">📅<\u002Fspan><div><h3 style=\"margin: 0 0 4px; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 21px\">Two days of remembering<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.55\">Día de los Muertos is celebrated November 1 and 2. It blends ancient Indigenous traditions from Mexico with Catholic holidays. Families often share pan de muerto, a sweet bread decorated with \"bones\" made of dough. 🍞<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div style=\"background: #FFF4E0; color: #2A1640; border-radius: 20px; padding: 18px 20px; display: flex; gap: 14px; align-items: flex-start\"><span style=\"font-size: 34px; line-height: 1\">🚗<\u002Fspan><div><h3 style=\"margin: 0 0 4px; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 21px\">Don't miss at the festival<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.55\">Bouncing low-rider cars, live music and dance, hands-on art activities, and the Muertos Mercado with 20+ vendors selling Day of the Dead crafts and gifts. 🛍️<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"text-align: center; color: #FFF4E0; padding: 8px 16px 0\">\n<p style=\"margin: 0; font-family: 'Lilita One', sans-serif; font-size: clamp(28px, 5vw, 44px); color: #FFC93C\">¡Nos vemos en el desfile! 🎉<\u002Fp>\n<p style=\"margin: 8px 0 0; font-size: 17px\">See you at the parade, Reilly familia! 💛🧡💖💚💜<\u002Fp>\n<\u002Ffooter>\n\n<\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:8600}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    var colors = ['#FF8C1A', '#FF5CAD', '#2EC4B6', '#FFC93C', '#9B5DE5'];\n    var icons = ['💀', '🌼', '🌸', '🕯️', '💀', '🌼', '🎉', '🌸', '💀', '🌼', '🕯️', '🌸'];\n    return { flags: icons.map(function (ic, i) { return { icon: ic, bg: colors[i % colors.length] }; }) };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
